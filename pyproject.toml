[project]
name = "tank-model"
dynamic = ["version"]
description = "Python implementation of Tank Hydrologic Model, a conceptual rainfall-runoff model proposed by Sugawara and Funiyuki (1956)"
readme = "readme.md"
requires-python = ">=3.12"
authors = [
    { name = "Nazmul Ahasan", email = "nzahasan@gmail.com" }
]
dependencies = [
    "click>=8.4.2",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pathlib>=1.0.1",
    "pytest>=9.1.1",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tank_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tank_core"]

[tool.hatch.build.targets.wheel.shared-scripts]
"scripts" = "/"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "pytest>=9.1.1",
    "twine>=6.2.0",
]
