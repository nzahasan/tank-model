[project]
name = "tank-model"
dynamic = ["version"]
description = "Python implementation of Tank Hydrologic Model, a conceptual rainfall-runoff model proposed by Sugawara and Funiyuki (1956)"
readme = "readme.md"
requires-python = ">=3.8"
authors = [
    { name = "Nazmul Ahasan", email = "nzahasan@gmail.com" }
]
dependencies = [
    "click>=8.1",
    "matplotlib>=3.7",
    "netcdf4>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tabulate>=0.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
tank_cmd = "tank_core.cli.tank_cmd:cli"
cpc_et = "tank_core.cli.cpc_et:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tank_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tank_core"]

[dependency-groups]
dev = [
    "flake8>=5.0",
    "pytest>=7.2",
    "twine>=4.0",
]
